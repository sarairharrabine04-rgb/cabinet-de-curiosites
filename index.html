<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2c080c">

    <title>SASS — Cabinet de Curiosités</title>
    <link rel="icon" type="image/png" href="cat.png">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Special+Elite&display=swap"
        rel="stylesheet">

    <style>
        /* RÉINITIALISATION */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background-color: #2c080c;
            background-image: radial-gradient(circle, #3d0c14 0%, #2c080c 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* --- ÉCRAN D'INTRODUCTION (LE SCEAU DE CIRE) --- */
        #intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #1a0407;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999;
            cursor: pointer;
            transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1), visibility 1.2s;
        }

        .seal-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: pulseGlow 3s ease-in-out infinite;
        }

        /* Le Sceau de cire visuel */
        .wax-seal-img {
            width: 140px;
            height: 140px;
            object-fit: contain;
            filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.9));
            transition: transform 0.4s ease, filter 0.4s ease;
            margin-bottom: 25px;
        }

        .wax-seal-img:hover {
            transform: scale(1.08);
            filter: drop-shadow(0 0 25px rgba(212, 175, 55, 0.4)) drop-shadow(0 15px 25px rgba(0, 0, 0, 0.9));
        }

        .intro-instruction {
            font-family: "Special Elite", cursive;
            font-size: 0.8rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #c5b5a9;
            opacity: 0.8;
            animation: fadeInOut 2s ease-in-out infinite;
        }

        /* Disparition de l'intro au clic */
        #intro-overlay.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }


        /* --- LE CONTENU DU SITE ( MÉDAILLON PRINCIPAL ) --- */
        .medaillon-container {
            position: relative;
            width: 800px;
            max-width: 100%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: scale(0.9);
            transition: opacity 1.5s ease, transform 1.5s cubic-bezier(0.16, 1, 0.3, 1);
            filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.7));
        }

        body.entered .medaillon-container {
            opacity: 1;
            transform: scale(1);
            animation: floatAround 6s ease-in-out infinite;
        }

        .medaillon-container::before {
            content: "";
            position: absolute;
            width: 70%;
            height: 70%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.15) 0%, transparent 70%);
            z-index: -1;
            animation: pulseGlow 4s ease-in-out infinite;
        }

        .medaillon-img {
            display: block;
            width: 100%;
            height: auto;
            filter: contrast(110%);
        }

        /* TEXTE DU MÉDAILLON */
        .content-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 55%;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .top-subtitle {
            font-family: "Special Elite", cursive;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            white-space: nowrap;
            color: #554b4d;
            margin-bottom: 5px;
            text-decoration: underline;
        }

        h1 {
            font-family: "Playfair Display", serif;
            font-weight: 400;
            font-style: italic;
            font-size: 3.8rem;
            line-height: 1.1;
            color: #1a1617;
            letter-spacing: 3px;
            margin-bottom: 5px;
        }

        .bottom-subtitle {
            font-family: "Special Elite", cursive;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            white-space: nowrap;
            color: #554b4d;
            margin-bottom: 25px;
        }

        /* NAVIGATION */
        .nav-links {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            width: 100%;
            font-family: "Special Elite", cursive;
            text-transform: uppercase;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .nav-links a {
            color: #1a1617;
            text-decoration: none;
            padding-bottom: 3px;
            border-bottom: 1px solid transparent;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            color: #3d0c14;
            letter-spacing: 2px;
            border-bottom: 1px solid #3d0c14;
        }


        /* --- ADAPTATION MOBILE --- */
        @media (max-width: 768px) {
            .medaillon-container {
                width: 100%;
                max-width: 520px;
            }

            .content-overlay {
                width: 50%;
                padding: 0;
            }

            .top-subtitle {
                font-size: clamp(0.38rem, 1.8vw, 0.55rem);
                margin-bottom: 8px;
            }

            h1 {
                font-size: clamp(1.8rem, 7vw, 2.5rem);
            }

            .bottom-subtitle {
                font-size: clamp(0.45rem, 2vw, 0.6rem);
                margin-bottom: 12px;
            }

            .nav-links {
                gap: clamp(6px, 1.8vw, 12px);
                font-size: clamp(0.4rem, 1.8vw, 0.6rem);
            }
        }


        /* --- ANIMATIONS --- */
        @keyframes fadeInOut {

            0%,
            100% {
                opacity: 0.4;
            }

            50% {
                opacity: 1;
            }
        }

        @keyframes floatAround {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes pulseGlow {

            0%,
            100% {
                opacity: 0.4;
                transform: scale(1);
            }

            50% {
                opacity: 0.8;
                transform: scale(1.05);
            }
        }
    </style>
</head>

<body>

    <!-- ÉCRAN D'INTRODUCTION AVEC LE SCEAU DE LA ROSE -->
    <div id="intro-overlay" onclick="entrerCabinet()">
        <div class="seal-container">
            <img src="sceau.png" alt="Sceau de cire" class="wax-seal-img">
            <div class="intro-instruction">— Briser le sceau pour entrer —</div>
        </div>
    </div>

    <!-- MÉDAILLON PRINCIPAL DU SITE -->
    <main class="medaillon-container">
        <img src="cadre.png" alt="Cadre en dentelle noire" class="medaillon-img">

        <div class="content-overlay">
            <div class="top-subtitle">Cabinet de Curiosités</div>
            <h1>SASS</h1>
            <div class="bottom-subtitle">Portfolio 3D</div>

            <nav class="nav-links" aria-label="Navigation principale">
                <a href="projets.html">Projets 3D</a>
                <a href="about.html">À propos</a>
            </nav>
        </div>
    </main>

    <script>
        function entrerCabinet() {
            const overlay = document.getElementById('intro-overlay');
            overlay.classList.add('fade-out');
            document.body.classList.add('entered');
        }
    </script>

</body>

</html>
