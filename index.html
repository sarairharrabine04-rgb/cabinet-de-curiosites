<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2c080c">

    <title>SASS — Cabinet de Curiosités</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Special+Elite&display=swap"
        rel="stylesheet">

    <style>
        /* --- RÉINITIALISATION --- */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            width: 100%;
            min-height: 100%;
        }

        body {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;

            background-color: #2c080c;
            background-image: radial-gradient(circle,
                    #3d0c14 0%,
                    #2c080c 100%);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
            overflow: hidden;
        }


        /* --- MÉDAILLON --- */

        .medaillon-container {
            position: relative;

            width: 800px;
            max-width: 100%;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            animation:
                dramaticIntro 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards,
                floatAround 6s ease-in-out infinite 1.6s;

            filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.7));
        }

        .medaillon-container::before {
            content: '';

            position: absolute;

            width: 70%;
            height: 70%;

            background: radial-gradient(circle,
                    rgba(212, 175, 55, 0.15) 0%,
                    transparent 70%);

            z-index: -1;

            animation: pulseGlow 4s ease-in-out infinite;
        }

        .medaillon-img {
            display: block;

            width: 100%;
            height: auto;

            filter: contrast(110%);
        }


        /* --- TEXTE À L'INTÉRIEUR DU CADRE --- */

        .content-overlay {
            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            width: 55%;
            padding: 10px;

            display: flex;
            flex-direction: column;
            align-items: center;

            text-align: center;
        }

        .top-subtitle {
            font-family: 'Special Elite', cursive;

            font-size: 0.75rem;
            letter-spacing: 2px;

            text-transform: uppercase;
            white-space: nowrap;

            color: #554b4d;

            margin-bottom: 5px;

            text-decoration: underline;
        }

        h1 {
            font-family: 'Playfair Display', serif;

            font-weight: 400;
            font-style: italic;

            font-size: 3.8rem;
            line-height: 1.1;

            color: #1a1617;

            letter-spacing: 3px;

            margin: 0 0 5px 0;
        }

        .bottom-subtitle {
            font-family: 'Special Elite', cursive;

            font-size: 0.75rem;
            letter-spacing: 2px;

            text-transform: uppercase;
            white-space: nowrap;

            color: #554b4d;

            margin-bottom: 25px;
        }


        /* --- NAVIGATION --- */

        .nav-links {
            display: flex;

            align-items: center;
            justify-content: center;

            gap: 30px;

            font-family: 'Special Elite', cursive;

            text-transform: uppercase;
            font-size: 0.85rem;

            white-space: nowrap;
        }

        .nav-links a {
            color: #1a1617;

            text-decoration: none;

            padding-bottom: 3px;

            border-bottom: 1px solid transparent;

            transition:
                color 0.3s ease,
                letter-spacing 0.3s ease,
                border-color 0.3s ease;
        }

        .nav-links a:hover {
            color: #3d0c14;

            letter-spacing: 2px;

            border-bottom: 1px solid #3d0c14;
        }


        /* --- ADAPTATION TABLETTES ET TÉLÉPHONES --- */

        @media (max-width: 768px) {

            .medaillon-container {
                width: 100%;
                max-width: 520px;
            }

            .content-overlay {
                width: 58%;
                padding: 0;

                top: 50%;
                left: 50%;

                transform: translate(-50%, -50%);
            }

            .top-subtitle {
                font-size: clamp(0.42rem, 2.2vw, 0.6rem);

                letter-spacing: 0.5px;

                margin-bottom: 3px;
            }

            h1 {
                font-size: clamp(2rem, 8vw, 2.8rem);

                letter-spacing: 1px;
                line-height: 1.1;

                margin-bottom: 3px;
            }

            .bottom-subtitle {
                font-size: clamp(0.48rem, 2.2vw, 0.65rem);

                letter-spacing: 1px;

                margin-bottom: 12px;
            }

            .nav-links {
                gap: clamp(10px, 3vw, 18px);

                font-size: clamp(0.55rem, 2.5vw, 0.7rem);
            }
        }


        /* --- PETITS TÉLÉPHONES --- */

        @media (max-width: 380px) {

            body {
                padding: 10px;
            }

            .content-overlay {
                width: 60%;
            }

            .top-subtitle {
                font-size: 0.42rem;
                letter-spacing: 0;
            }

            h1 {
                font-size: 1.8rem;
            }

            .bottom-subtitle {
                font-size: 0.48rem;
                letter-spacing: 0.5px;

                margin-bottom: 8px;
            }

            .nav-links {
                gap: 8px;
                font-size: 0.5rem;
            }
        }


        /* --- TÉLÉPHONE EN MODE PAYSAGE --- */

        @media (max-width: 768px) and (orientation: landscape) {

            body {
                padding: 10px;
            }

            .medaillon-container {
                width: min(75vw, 650px);
            }

            .content-overlay {
                width: 55%;
            }

            .top-subtitle {
                font-size: 0.5rem;
                margin-bottom: 2px;
            }

            h1 {
                font-size: 2rem;
            }

            .bottom-subtitle {
                font-size: 0.5rem;
                margin-bottom: 8px;
            }

            .nav-links {
                gap: 12px;
                font-size: 0.6rem;
            }
        }


        /* --- ANIMATIONS --- */

        @keyframes dramaticIntro {
            0% {
                opacity: 0;
                transform: scale(0.85) translateY(40px);
            }

            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes floatAround {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes pulseGlow {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.4;
            }

            50% {
                transform: scale(1.15);
                opacity: 0.8;
            }
        }
    </style>
</head>

<body>

    <main class="medaillon-container">

        <img src="cadre.png" alt="Cadre en dentelle noire du portfolio SASS" class="medaillon-img">

        <div class="content-overlay">

            <div class="top-subtitle">
                Cabinet de Curiosités
            </div>

            <h1>SASS</h1>

            <div class="bottom-subtitle">
                Portfolio 3D
            </div>

            <nav class="nav-links" aria-label="Navigation principale">

                <a href="projets.html">
                    Projets 3D
                </a>

                <a href="about.html">
                    À propos
                </a>

            </nav>

        </div>

    </main>

</body>

</html>
