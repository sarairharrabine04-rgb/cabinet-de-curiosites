<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SASS — Cabinet de Curiosités</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Special+Elite&display=swap"
        rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #2c080c;
            background-image: radial-gradient(circle, #3d0c14 0%, #2c080c 100%);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            overflow: hidden;
        }

        .medaillon-container {
            position: relative;
            width: 800px;
            max-width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: dramaticIntro 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards, floatAround 6s ease-in-out infinite 1.6s;
            filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.7));
        }

        .medaillon-container::before {
            content: '';
            position: absolute;
            width: 70%;
            height: 70%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.15) 0%, transparent 70%);
            z-index: -1;
            animation: pulseGlow 4s ease-in-out infinite;
        }

        .medaillon-img {
            width: 100%;
            height: auto;
            display: block;
            filter: contrast(110%);
        }

        /* Zone de texte intérieure parfaitement calée */
        .content-overlay {
            position: absolute;
            text-align: center;
            width: 55%;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .top-subtitle {
            font-family: 'Special Elite', cursive;
            font-size: clamp(0.5rem, 1.3vw, 0.75rem);
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #554b4d;
            margin-bottom: 4px;
            text-decoration: underline;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-weight: 400;
            font-style: italic;
            font-size: clamp(2rem, 5vw, 3.8rem);
            color: #1a1617;
            letter-spacing: 3px;
            margin: 0 0 4px 0;
        }

        .bottom-subtitle {
            font-family: 'Special Elite', cursive;
            font-size: clamp(0.5rem, 1.3vw, 0.75rem);
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #554b4d;
            margin-bottom: 18px;
        }

        /* Liens de navigation */
        .nav-links {
            display: flex;
            justify-content: center;
            gap: clamp(12px, 2.5vw, 30px);
            font-family: 'Special Elite', cursive;
            text-transform: uppercase;
            font-size: clamp(0.6rem, 1.4vw, 0.85rem);
        }

        .nav-links a {
            color: #1a1617;
            text-decoration: none;
            padding-bottom: 2px;
            border-bottom: 1px solid transparent;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            color: #3d0c14;
            letter-spacing: 2px;
            border-bottom: 1px solid #3d0c14;
        }

        /* Ajustement spécifique sur très petits écrans en mode portrait */
        @media (max-width: 500px) {
            .content-overlay {
                width: 68%;
            }

            .top-subtitle {
                font-size: 0.5rem;
                letter-spacing: 1px;
                margin-bottom: 2px;
            }

            h1 {
                font-size: 1.8rem;
                letter-spacing: 1px;
                margin-bottom: 2px;
            }

            .bottom-subtitle {
                font-size: 0.5rem;
                letter-spacing: 1px;
                margin-bottom: 10px;
            }

            .nav-links {
                gap: 10px;
                font-size: 0.6rem;
            }
        }

        /* --- ANIMATIONS --- */
        @keyframes dramaticIntro {
            0% {
                opacity: 0;
                transform: scale(0.85) translateY(40px);
            }

            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes floatAround {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes pulseGlow {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.4;
            }

            50% {
                transform: scale(1.15);
                opacity: 0.8;
            }
        }
    </style>
</head>

<body>

    <div class="medaillon-container">
        <img src="cadre.png" alt="Cadre dentelle SASS" class="medaillon-img">

        <div class="content-overlay">
            <div class="top-subtitle">Cabinet de Curiosités</div>
            <h1>SASS</h1>
            <div class="bottom-subtitle">Portfolio 3D</div>

            <div class="nav-links">
                <a href="projets.html">Projets 3D</a>
                <a href="about.html">À propos</a>
            </div>
        </div>
    </div>

</body>

</html>
