<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SASS — L'Atelier</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Special+Elite&display=swap"
        rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #2c080c;
            background-image: radial-gradient(circle, #3d0c14 0%, #2c080c 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .atelier-card {
            background-color: #f4efe6;
            color: #1a1617;
            width: 900px;
            max-width: 100%;
            padding: 30px;
            text-align: center;
            position: relative;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            border: 2px solid #d4cfc4;
            background-image: repeating-linear-gradient(90deg, transparent, transparent 15px, rgba(0, 0, 0, 0.02) 15px, rgba(0, 0, 0, 0.02) 18px);
        }

        .back-link {
            font-family: 'Special Elite', cursive;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #554b4d;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 20px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-weight: 400;
            font-style: italic;
            font-size: 2.5rem;
            color: #1a1617;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .setup-big-box {
            width: 100%;
            height: 45vh;
            min-height: 300px;
            border: 2px solid #d4cfc4;
            background-color: #000;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .setup-big-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: contrast(105%);
        }

        .atelier-desc {
            font-family: 'Special Elite', cursive;
            font-size: 0.85rem;
            color: #554b4d;
            letter-spacing: 2px;
        }
    </style>
</head>

<body>

    <div class="atelier-card">
        <a href="projets.html" class="back-link">← Retour aux projets</a>

        <h1>L'Atelier</h1>

        <div class="setup-big-box">
            <img src="image8.jpeg" alt="Mon Setup de travail">
        </div>

        <div class="atelier-desc">Là où la magie prend vie dans l'obscurité et le velours.</div>
    </div>

</body>

</html>
